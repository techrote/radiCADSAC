name: MC-038 H1 oriented angular-drift signed-event source proof

on:
  push:
    branches:
      - research/mc038-affine-h1-angular-drift-20261106
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701_affine_h1_angular_drift_20261106.py
      - research/machining-completeness/tasks/MC-038/pb00701-affine-h1-angular-drift-20261106.json
      - research/machining-completeness/tasks/MC-038/pb00701-affine-h1-angular-drift-20261106.md
      - .github/workflows/mc1-pb00701-affine-h1-angular-drift.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-oriented-h1-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal HEAD provenance
        shell: bash
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned originals, exact proof, receipt and adversaries
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_affine_h1_angular_drift_20261106.py --contract --self-test

  frozen-v54-v2-producer-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal HEAD provenance
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full original-source V54/V2 evidence reproduction
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract

  mc1-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal HEAD provenance
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full MC-1 static and authority validation
        run: python3 tools/validate_machining_completeness.py
