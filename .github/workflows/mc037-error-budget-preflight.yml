name: MC-037 exact error-allocation preparation
on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-037/error_budget_preflight.py'
      - 'research/machining-completeness/tasks/MC-037/error-budget-preflight-20261106.md'
      - '.github/workflows/mc037-error-budget-preflight.yml'
  workflow_dispatch:
jobs:
  bounded-prepare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove literal checkout identity
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'literal checkout=%s expected=%s\n' "$actual" "$EXPECTED"
          test "$actual" = "$EXPECTED"
      - name: Execute on-disk adversarial tests
        shell: bash
        run: python research/machining-completeness/tasks/MC-037/error_budget_preflight.py --self-test
      - name: Generate and reimport PLAN_ONLY proposal
        shell: bash
        run: |
          python research/machining-completeness/tasks/MC-037/error_budget_preflight.py --emit-proposal > proposal.json
          python research/machining-completeness/tasks/MC-037/error_budget_preflight.py --check-file proposal.json
      - name: Verify existing programme static contracts
        shell: bash
        run: python tools/validate_machining_completeness.py
