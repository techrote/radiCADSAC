name: quality

on:
  push:
    branches: [main]
  pull_request:
    # MC-1 planning-only impact routing: native historical campaigns are not
    # evidence for documentation/registry adoption and must not be dispatched by it.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-research-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate repository
        run: python3 tools/validate_repo.py
      - name: Validate RCS-003 adversarial corpus
        run: python3 tools/validate_rcs003.py
      - name: Validate RCS-004 OCCT audit
        run: python3 tools/validate_rcs004.py
      - name: Validate RCS-005 STEP conformance contract
        run: python3 tools/validate_rcs005.py
      - name: Validate RCS-006 harness contracts
        run: python3 tools/validate_rcs006.py
      - name: Validate RCS-007 tolerance research
        run: python3 tools/validate_rcs007.py
      - name: Validate RCS-008 provenance research
        run: python3 tools/validate_rcs008.py
      - name: Validate RCS-009 regularized/deferred topology research
        run: python3 tools/validate_rcs009.py

  # Stage 1: establish the exact pinned OCCT install independently of the
  # worker and campaign. A successful dependency build is persisted before any
  # later research stage can fail.
  rcs006-occt-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RCS006_OCCT_PREFIX: ${{ github.workspace }}/.deps/rcs006/occt-8.0.1
      RCS006_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore pinned OCCT build cache
        id: rcs006-occt-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}
      - name: Install cold-bootstrap prerequisites
        if: steps.rcs006-occt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Bootstrap exact OCCT baseline
        run: bash research/rcs-006/harness/bootstrap_occt.sh
      - name: Verify pinned OCCT install
        run: bash research/rcs-006/harness/verify_occt_install.sh
      - name: Save pinned OCCT build cache
        if: success() && steps.rcs006-occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}

  # Stage 1 proof: a fresh job must restore the exact cache and the bootstrap
  # must take its already-installed fast path.
  rcs006-occt-cache-verify:
    needs: rcs006-occt-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RCS006_OCCT_PREFIX: ${{ github.workspace }}/.deps/rcs006/occt-8.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore pinned OCCT cache for reuse proof
        id: rcs006-occt-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}
          fail-on-cache-miss: true
      - name: Verify restored OCCT install
        run: bash research/rcs-006/harness/verify_occt_install.sh
      - name: Prove bootstrap reuses restored install
        shell: bash
        run: |
          set -euo pipefail
          output="$(bash research/rcs-006/harness/bootstrap_occt.sh 2>&1)"
          printf '%s\n' "$output"
          grep -Fq "RCS-006 OCCT already installed" <<<"$output"

  rcs006-worker-smoke:
    needs: rcs006-occt-cache-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RCS006_OCCT_PREFIX: ${{ github.workspace }}/.deps/rcs006/occt-8.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Restore verified pinned OCCT cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}
          fail-on-cache-miss: true
      - name: Configure RCS-006 worker
        run: |
          cmake -S research/rcs-006/harness -B .build/rcs006 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RCS006_OCCT_PREFIX"
      - name: Build RCS-006 worker
        run: cmake --build .build/rcs006 --parallel 2
      - name: Run process-isolated smoke campaign
        shell: bash
        run: |
          set +e
          export LD_LIBRARY_PATH="$RCS006_OCCT_PREFIX/lib:$RCS006_OCCT_PREFIX/lib64:${LD_LIBRARY_PATH:-}"
          python3 research/rcs-006/harness/run_campaign.py \
            --worker .build/rcs006/rcs006_occt_worker \
            --profile smoke \
            --repeats 2 \
            --out-dir .results/rcs006-smoke
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            exit "$status"
          fi
      - name: Validate smoke result artifacts
        run: python3 tools/validate_rcs006.py --results-dir .results/rcs006-smoke
      - name: Upload RCS-006 smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs006-occt-8.0.1-smoke
          path: .results/rcs006-smoke
          if-no-files-found: warn

  rcs007-tolerance-smoke:
    needs: rcs006-occt-cache-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RCS006_OCCT_PREFIX: ${{ github.workspace }}/.deps/rcs006/occt-8.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Restore verified pinned OCCT cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}
          fail-on-cache-miss: true
      - name: Configure RCS-006 baseline worker
        run: |
          cmake -S research/rcs-006/harness -B .build/rcs006 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RCS006_OCCT_PREFIX"
      - name: Build RCS-006 baseline worker
        run: cmake --build .build/rcs006 --parallel 2
      - name: Configure RCS-007 finishing worker
        run: |
          cmake -S research/rcs-007/harness -B .build/rcs007 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RCS006_OCCT_PREFIX"
      - name: Build RCS-007 finishing worker
        run: cmake --build .build/rcs007 --parallel 2
      - name: Run RCS-007 smoke campaign
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RCS006_OCCT_PREFIX/lib:$RCS006_OCCT_PREFIX/lib64:${LD_LIBRARY_PATH:-}"
          python3 research/rcs-007/harness/run_tolerance_campaign.py \
            --worker .build/rcs006/rcs006_occt_worker \
            --finish-worker .build/rcs007/rcs007_finish_worker \
            --profile smoke \
            --out-dir .results/rcs007-smoke
      - name: Reconcile RCS-007 evidence semantics
        run: python3 research/rcs-007/harness/reconcile_results.py --results-dir .results/rcs007-smoke
      - name: Validate RCS-007 runtime evidence
        run: python3 tools/validate_rcs007.py --results-dir .results/rcs007-smoke
      - name: Upload RCS-007 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs007-virtual-tolerance-smoke
          path: .results/rcs007-smoke
          if-no-files-found: error

  rcs008-provenance-smoke:
    needs: rcs006-occt-cache-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RCS006_OCCT_PREFIX: ${{ github.workspace }}/.deps/rcs006/occt-8.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Restore verified pinned OCCT cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}
          fail-on-cache-miss: true
      - name: Configure RCS-008 provenance worker
        run: |
          cmake -S research/rcs-008/harness -B .build/rcs008 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RCS006_OCCT_PREFIX"
      - name: Build RCS-008 provenance worker
        run: cmake --build .build/rcs008 --parallel 2
      - name: Run RCS-008 provenance smoke campaign
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RCS006_OCCT_PREFIX/lib:$RCS006_OCCT_PREFIX/lib64:${LD_LIBRARY_PATH:-}"
          python3 research/rcs-008/harness/run_provenance_campaign.py \
            --worker .build/rcs008/rcs008_provenance_worker \
            --profile smoke \
            --out-dir .results/rcs008-smoke
      - name: Validate RCS-008 runtime evidence
        run: python3 tools/validate_rcs008.py --results-dir .results/rcs008-smoke
      - name: Upload RCS-008 provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs008-provenance-smoke
          path: .results/rcs008-smoke
          if-no-files-found: error

  # RCS-009 compares the immediate RCS-006 B-rep baseline with a bounded
  # deferred-removal candidate over the same physical fixture geometry. A
  # CellsBuilder warning/failure is preserved as evidence; candidate material,
  # body, protocol and STEP-reconciliation failures remain CI failures.
  rcs009-deferred-topology-smoke:
    needs: rcs006-occt-cache-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RCS006_OCCT_PREFIX: ${{ github.workspace }}/.deps/rcs006/occt-8.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Restore verified pinned OCCT cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}
          fail-on-cache-miss: true
      - name: Configure RCS-006 baseline worker
        run: |
          cmake -S research/rcs-006/harness -B .build/rcs006 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RCS006_OCCT_PREFIX"
      - name: Build RCS-006 baseline worker
        run: cmake --build .build/rcs006 --parallel 2
      - name: Configure RCS-009 deferred-topology worker
        run: |
          cmake -S research/rcs-009/harness -B .build/rcs009 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RCS006_OCCT_PREFIX"
      - name: Build RCS-009 deferred-topology worker
        run: cmake --build .build/rcs009 --parallel 2
      - name: Run RCS-009 smoke comparison
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RCS006_OCCT_PREFIX/lib:$RCS006_OCCT_PREFIX/lib64:${LD_LIBRARY_PATH:-}"
          python3 research/rcs-009/harness/run_deferred_campaign.py \
            --baseline-worker .build/rcs006/rcs006_occt_worker \
            --candidate-worker .build/rcs009/rcs009_deferred_worker \
            --profile smoke \
            --out-dir .results/rcs009-smoke
      - name: Validate RCS-009 runtime evidence
        run: python3 tools/validate_rcs009.py --results-dir .results/rcs009-smoke
      - name: Upload RCS-009 deferred-topology evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs009-deferred-topology-smoke
          path: .results/rcs009-smoke
          if-no-files-found: error
