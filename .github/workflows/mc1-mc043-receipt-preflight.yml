name: mc1-mc043-receipt-preflight

on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-043/**'
      - '.github/workflows/mc1-mc043-receipt-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-043/**'
      - '.github/workflows/mc1-mc043-receipt-preflight.yml'

permissions:
  contents: read

jobs:
  source-matched-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile provisional preflight
        run: |
          python3 -m py_compile \
            research/machining-completeness/tasks/MC-043/consumer_receipt_preflight.py \
            research/machining-completeness/tasks/MC-043/verify.py
      - name: Enforce synthetic structural controls and all negative mutations
        run: python3 research/machining-completeness/tasks/MC-043/verify.py --contract --self-test
