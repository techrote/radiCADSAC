name: MC-038 octant node sided-event and V6 knot research

on:
  push:
    branches:
      - research/mc038-h0h1-node-sided-events-20261107
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701_h0h1_node_sided_events_20261107.py
      - research/machining-completeness/tasks/MC-038/pb00701-h0h1-node-sided-events-20261107.md
      - research/machining-completeness/tasks/MC-038/pb00701-h0h1-false-knot-provenance-20261107.json
      - .github/workflows/mc1-pb00701-h0h1-node-sided-events.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-knot-sided-events:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact literal source head
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact knot/original V6 producing contract and 14 adversarial controls
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_h0h1_node_sided_events_20261107.py --contract --self-test

  frozen-original-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact literal source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Produce complete historical V54/V2 fifty-source replay
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract

  mc1-static-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact literal source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate MC-1 static programme authority
        run: python3 tools/validate_machining_completeness.py
