name: mc1-pb00701-v52
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/*piecewise*product*'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v52.md'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v52.py'
      - 'docs/machining-completeness/76-PB00701-PIECEWISE-PRODUCT.md'
      - '.github/workflows/mc1-pb00701-v52.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/*piecewise*product*'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v52.md'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v52.py'
      - 'docs/machining-completeness/76-PB00701-PIECEWISE-PRODUCT.md'
      - '.github/workflows/mc1-pb00701-v52.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full-source knot equality, ordered root union and sign cells
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v52.py --contract --self-test
