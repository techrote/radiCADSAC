name: mc1-pb00701-v25
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_component_cone_phase_anchor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_component_cone_phase_anchor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v25.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-component-cone-phase-anchor-boundary-v25.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v25.md'
      - 'docs/machining-completeness/51-PB00701-COMPONENT-CONE-PHASE-ANCHOR.md'
      - '.github/workflows/mc1-pb00701-v25.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_component_cone_phase_anchor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_component_cone_phase_anchor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v25.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-component-cone-phase-anchor-boundary-v25.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v25.md'
      - 'docs/machining-completeness/51-PB00701-COMPONENT-CONE-PHASE-ANCHOR.md'
      - '.github/workflows/mc1-pb00701-v25.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v25 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_component_cone_phase_anchor_model.py research/machining-completeness/tasks/MC-038/test_pb00701_component_cone_phase_anchor_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v25.py
      - name: Verify PB-007-01 v25 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v25.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v25.py --self-test
