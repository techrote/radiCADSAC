name: mc1-pb00701-v40
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_signed_b_anti_diagonal_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_signed_b_anti_diagonal_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v40.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-signed-b-anti-diagonal-v40.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v40.md'
      - 'docs/machining-completeness/66-PB00701-SIGNED-B-ANTI-DIAGONAL-DIRECT-ROTATED-COORDINATE.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701_signed_a_direct_rotated_coordinate_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_signed_a_direct_rotated_coordinate_adversarial.py'
      - '.github/workflows/mc1-pb00701-v40.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_signed_b_anti_diagonal_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_signed_b_anti_diagonal_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v40.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-signed-b-anti-diagonal-v40.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v40.md'
      - 'docs/machining-completeness/66-PB00701-SIGNED-B-ANTI-DIAGONAL-DIRECT-ROTATED-COORDINATE.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701_signed_a_direct_rotated_coordinate_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_signed_a_direct_rotated_coordinate_adversarial.py'
      - '.github/workflows/mc1-pb00701-v40.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v40 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_signed_b_anti_diagonal_model.py research/machining-completeness/tasks/MC-038/test_pb00701_signed_b_anti_diagonal_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v40.py
      - name: Verify PB-007-01 v40 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v40.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v40.py --self-test
