        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00704.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00704.py --self-test
      - name: Check live managed GitHub task issues for zero drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/mc_workflow.py sync --check
      - name: Show current evidence-ready frontier
        run: python3 tools/mc_workflow.py ready
