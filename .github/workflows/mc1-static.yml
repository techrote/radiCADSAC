name: mc1-static
on:
  workflow_dispatch:
  push:
    branches: [main, mc-1-workflow-adoption]
    paths:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/validate_bootstrap_consistency.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_evidence_verifier.py'
      - '.github/workflows/mc1-static.yml'
  pull_request:
    paths:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_evidence_verifier.py'
      - '.github/workflows/mc1-static.yml'
permissions:
  contents: read
  issues: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository baseline contracts
        run: python3 tools/validate_repo.py
      - name: Validate MC-1 contracts and adversarial self-tests
        run: python3 tools/validate_machining_completeness.py --self-test
      - name: Validate planning/native CI impact routing
        run: python3 tools/validate_mc_ci_impact.py --self-test
      - name: Validate preserved Genesis-v2.1 consistency under MC-1 routing
        run: |
          python3 tools/validate_bootstrap_consistency.py
          python3 tools/validate_bootstrap_consistency.py --adversarial-self-test
      - name: Compile MC tooling
        run: python3 -m py_compile tools/validate_machining_completeness.py tools/validate_mc_ci_impact.py tools/validate_bootstrap_consistency.py tools/mc_workflow.py tools/mc_evidence_verifier.py research/machining-completeness/tasks/MC-004/verify.py research/machining-completeness/tasks/MC-005/verify.py research/machining-completeness/tasks/MC-006/verify.py research/machining-completeness/tasks/MC-007/verify.py research/machining-completeness/tasks/MC-008/verify.py research/machining-completeness/tasks/MC-009/verify.py research/machining-completeness/tasks/MC-010/independent_exact_oracle.py research/machining-completeness/tasks/MC-010/verify.py research/machining-completeness/tasks/MC-011/fixture_oracle.py research/machining-completeness/tasks/MC-011/verify.py research/machining-completeness/tasks/MC-012/fixture_oracle.py research/machining-completeness/tasks/MC-012/verify.py research/machining-completeness/tasks/MC-013/fixture_oracle.py research/machining-completeness/tasks/MC-013/verify.py research/machining-completeness/tasks/MC-014/fixture_oracle.py research/machining-completeness/tasks/MC-014/verify.py research/machining-completeness/tasks/MC-015/certificate_checker.py research/machining-completeness/tasks/MC-015/verify.py research/machining-completeness/tasks/MC-016/verify.py research/machining-completeness/tasks/MC-017/verify.py research/machining-completeness/tasks/MC-018/fixed_axis_sweep.py research/machining-completeness/tasks/MC-018/verify.py research/machining-completeness/tasks/MC-019/ball_round_sweep.py research/machining-completeness/tasks/MC-019/verify.py research/machining-completeness/tasks/MC-020/form_undercut_sweep.py research/machining-completeness/tasks/MC-020/verify.py research/machining-completeness/tasks/MC-021/rotational_reduction.py research/machining-completeness/tasks/MC-021/verify.py research/machining-completeness/tasks/MC-022/phase_sensitive_lathe.py research/machining-completeness/tasks/MC-022/verify.py research/machining-completeness/tasks/MC-023/multi_setup.py research/machining-completeness/tasks/MC-023/verify.py research/machining-completeness/tasks/MC-024/verify.py research/machining-completeness/tasks/MC-025/verify.py research/machining-completeness/tasks/MC-026/selection_model.py research/machining-completeness/tasks/MC-026/verify.py research/machining-completeness/tasks/MC-027/verify.py research/machining-completeness/tasks/MC-028/verify.py research/machining-completeness/tasks/MC-029/verify.py research/machining-completeness/tasks/MC-030/dispatch_model.py research/machining-completeness/tasks/MC-030/verify.py research/machining-completeness/tasks/MC-031/material_evaluator.py research/machining-completeness/tasks/MC-031/verify.py research/machining-completeness/tasks/MC-032/event_engine.py research/machining-completeness/tasks/MC-032/verify.py research/machining-completeness/tasks/MC-033/body_state.py research/machining-completeness/tasks/MC-033/verify.py research/machining-completeness/tasks/MC-038/verify.py research/machining-completeness/tasks/MC-038/pb00701_event_model.py research/machining-completeness/tasks/MC-038/verify_pb00701.py research/machining-completeness/tasks/MC-038/pb00703_source_codec.py research/machining-completeness/tasks/MC-038/verify_pb00703.py research/machining-completeness/tasks/MC-038/pb00704_topology_checker.py research/machining-completeness/tasks/MC-038/verify_pb00704.py research/machining-completeness/tasks/MC-045/campaign_harness.py research/machining-completeness/tasks/MC-045/verify.py research/machining-completeness/tasks/MC-049/challenge_generator.py research/machining-completeness/tasks/MC-049/verify.py research/machining-completeness/tasks/MC-054/verify.py research/machining-completeness/tasks/MC-055/verify.py research/machining-completeness/tasks/MC-058/verify.py
      - name: Verify completed planning/research tasks
        run: |
          python3 tools/mc_workflow.py verify MC-001
