name: mc1-pb00701-discontinuous-knot-topology
on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_discontinuous_knot_topology.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_discontinuous_knot_topology.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-discontinuous-knot-topology.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-discontinuous-knot-topology-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation-v2.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-discontinuous-knot-topology.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_discontinuous_knot_topology.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_discontinuous_knot_topology.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-discontinuous-knot-topology.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-discontinuous-knot-topology-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation-v2.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-discontinuous-knot-topology.yml'
permissions:
  contents: read
jobs:
  source-knot-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact source, discontinuous knot policy, machine report and frozen census
        shell: bash
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_discontinuous_knot_topology.py --contract --self-test
