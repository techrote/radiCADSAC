name: mc1-pb00701-v47
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/*algebraic*interval*'
      - 'research/machining-completeness/tasks/MC-038/*algebraic*monotone*cut*'
      - 'research/machining-completeness/tasks/MC-038/pb00701-algebraic-single-cut-v47.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v47.md'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v47.py'
      - 'docs/machining-completeness/71-PB00701-ALGEBRAIC-SINGLE-CUT.md'
      - '.github/workflows/mc1-pb00701-v47.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/*algebraic*interval*'
      - 'research/machining-completeness/tasks/MC-038/*algebraic*monotone*cut*'
      - 'research/machining-completeness/tasks/MC-038/pb00701-algebraic-single-cut-v47.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v47.md'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v47.py'
      - 'docs/machining-completeness/71-PB00701-ALGEBRAIC-SINGLE-CUT.md'
      - '.github/workflows/mc1-pb00701-v47.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact closed-child authority and source-bound composition
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v47.py --contract --self-test
