name: MC-038 frozen V12 phase-grid direct-admission falsification
on:
  push:
    branches:
      - research/mc038-v12-phasegrid-admission-20261106
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701_v12_phasegrid_admission_20261106.py
      - research/machining-completeness/tasks/MC-038/pb00701-v12-phasegrid-admission-20261106.json
      - research/machining-completeness/tasks/MC-038/pb00701-v12-phasegrid-admission-20261106.md
      - .github/workflows/mc1-pb00701-v12-phasegrid-admission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal source head
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned original V12 and independent source census
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_v12_phasegrid_admission_20261106.py --contract --self-test
  frozen-v54-v2-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Complete frozen 121-source 50-V2 replay
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract
  global-mc1-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full MC-1 static validation
        run: python3 tools/validate_machining_completeness.py
