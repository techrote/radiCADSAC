name: mc038-orchestration-cleanup
on:
  push:
    branches: [mc038/pre-gate-dependency-repair]
    paths:
      - '.github/workflows/mc038-orchestration-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve UTF-8 JSON spelling
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/machining-completeness/task-graph-v1.json')
          obj=json.loads(p.read_text())
          p.write_text(json.dumps(obj, indent=2, ensure_ascii=False)+'\n')
          PY
          python3 tools/validate_machining_completeness.py --self-test
          python3 research/machining-completeness/tasks/MC-038/verify.py --contract
      - name: Commit encoding-only cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/machining-completeness/task-graph-v1.json
          git diff --cached --check
          git commit -m 'MC-038 repair: preserve task-graph UTF-8 spelling'
          git push origin HEAD:mc038/pre-gate-dependency-repair
