name: mc1-pb00701-h1-rational-rephase-obstruction

on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_h1_rational_rephase_obstruction_20261106.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-h1-rational-rephase-obstruction-20261106.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-h1-rational-rephase-obstruction-20261106.md'
      - '.github/workflows/mc1-pb00701-h1-rational-rephase-obstruction.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_h1_rational_rephase_obstruction_20261106.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-h1-rational-rephase-obstruction-20261106.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-h1-rational-rephase-obstruction-20261106.md'
      - '.github/workflows/mc1-pb00701-h1-rational-rephase-obstruction.yml'

permissions:
  contents: read

jobs:
  h1-original-source-nonsquare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Literal original source head identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Checked out exact commit $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Source-pinned real-rational amplitude impossibility and adversarial controls
        shell: bash
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/pb00701_h1_rational_rephase_obstruction_20261106.py --contract --self-test
      - name: Complete frozen fifty-original V54/V2 producing reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract
      - name: Programme and authority static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_machining_completeness.py
