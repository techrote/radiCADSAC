name: MC-038 frozen V27 sign-trit boundary proof
on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v27_sign_trit_boundary_20261105.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_v27_sign_trit_boundary_20261105.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v27-sign-trit-boundary-20261105.*'
      - '.github/workflows/mc1-pb00701-v27-sign-trit-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v27_sign_trit_boundary_20261105.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_v27_sign_trit_boundary_20261105.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v27-sign-trit-boundary-20261105.*'
      - '.github/workflows/mc1-pb00701-v27-sign-trit-boundary.yml'
permissions:
  contents: read
jobs:
  original-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'exact-head=%s\n' "$actual"
      - name: Original frozen V27 proof and mutations
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_v27_sign_trit_boundary_20261105.py --contract --self-test
      - name: Independent source-level test suite
        run: python3 research/machining-completeness/tasks/MC-038/test_pb00701_v27_sign_trit_boundary_20261105.py
      - name: Full frozen original evidence replay
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract
      - name: MC-1 static programme guard
        run: python3 tools/validate_machining_completeness.py
