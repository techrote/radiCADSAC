name: mc1-pb00701-v28
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_algebraic_phase_cell_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_phase_cell_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v28.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-algebraic-phase-cell-boundary-v28.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v28.md'
      - 'docs/machining-completeness/54-PB00701-ALGEBRAIC-PHASE-CELL.md'
      - '.github/workflows/mc1-pb00701-v28.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_algebraic_phase_cell_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_phase_cell_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v28.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-algebraic-phase-cell-boundary-v28.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v28.md'
      - 'docs/machining-completeness/54-PB00701-ALGEBRAIC-PHASE-CELL.md'
      - '.github/workflows/mc1-pb00701-v28.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v28 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_algebraic_phase_cell_model.py research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_phase_cell_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v28.py
      - name: Verify PB-007-01 v28 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v28.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v28.py --self-test
