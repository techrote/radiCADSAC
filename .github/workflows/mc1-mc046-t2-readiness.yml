name: MC-046 T2 scale PLAN_ONLY readiness
on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-046/**'
      - '.github/workflows/mc1-mc046-t2-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-046/**'
      - '.github/workflows/mc1-mc046-t2-readiness.yml'
permissions:
  contents: read
jobs:
  t2-plan-only-contract:
    name: MC-046 source-bound readiness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify literal source identity
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "source-sha=$actual"
      - name: Check MC-004 pinned source and T2 envelope
        run: python3 research/machining-completeness/tasks/MC-046/readiness.py --contract
      - name: Run 32 adversarial readiness refusals
        run: python3 research/machining-completeness/tasks/MC-046/readiness.py --self-test
      - name: Run independent programme static constraints
        run: python3 tools/validate_machining_completeness.py
