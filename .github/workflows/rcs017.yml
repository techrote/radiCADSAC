name: rcs017-concurrency-research

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-rcs017:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate RCS-017 research contracts
        run: python3 tools/validate_rcs017.py

  concurrency-smoke:
    needs: validate-rcs017
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RCS006_OCCT_PREFIX: ${{ github.workspace }}/.deps/rcs006/occt-8.0.1
      RCS006_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore pinned OCCT cache
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}
      - name: Ensure Ninja is available
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
      - name: Bootstrap exact OCCT baseline if required
        run: bash research/rcs-006/harness/bootstrap_occt.sh
      - name: Verify exact OCCT baseline
        run: bash research/rcs-006/harness/verify_occt_install.sh
      - name: Configure RCS-017 probe
        run: |
          cmake -S research/rcs-017/harness -B .build/rcs017 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RCS006_OCCT_PREFIX"
      - name: Build RCS-017 probe
        run: cmake --build .build/rcs017 --parallel 2
      - name: Run RCS-017 concurrency campaign
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RCS006_OCCT_PREFIX/lib:$RCS006_OCCT_PREFIX/lib64:${LD_LIBRARY_PATH:-}"
          python3 research/rcs-017/harness/run_concurrency_campaign.py \
            --worker .build/rcs017/rcs017_concurrency_probe \
            --profile smoke \
            --out-dir .results/rcs017-smoke
      - name: Validate measured RCS-017 evidence
        run: python3 tools/validate_rcs017.py --results-dir .results/rcs017-smoke
      - name: Upload RCS-017 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs017-concurrency-smoke
          path: .results/rcs017-smoke
          if-no-files-found: error
