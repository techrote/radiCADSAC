name: rcs017-concurrency-research

on:
  push:
    branches: [main]
    # MC-1 planning-only changes must not dispatch historical campaigns on merge.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - 'tools/validate_bootstrap_consistency.py'
      - '.github/workflows/**'
  pull_request:
    # MC-1 planning-only impact routing: native historical campaigns are not
    # evidence for documentation/registry adoption and must not be dispatched by it.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_bootstrap_consistency.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-rcs017:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate RCS-017 research contracts
        run: python3 tools/validate_rcs017.py

  concurrency-stress:
    needs: validate-rcs017
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RCS006_OCCT_PREFIX: ${{ github.workspace }}/.deps/rcs006/occt-8.0.1
      RCS006_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore pinned OCCT cache
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}
      - name: Ensure Ninja is available
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
      - name: Bootstrap exact OCCT baseline if required
        run: bash research/rcs-006/harness/bootstrap_occt.sh
      - name: Verify exact OCCT baseline
        run: bash research/rcs-006/harness/verify_occt_install.sh
      - name: Configure RCS-017 probe
        run: |
          cmake -S research/rcs-017/harness -B .build/rcs017 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RCS006_OCCT_PREFIX"
      - name: Build RCS-017 probe
        run: cmake --build .build/rcs017 --parallel 2
      - name: Run RCS-017 concurrency campaign
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RCS006_OCCT_PREFIX/lib:$RCS006_OCCT_PREFIX/lib64:${LD_LIBRARY_PATH:-}"
          python3 research/rcs-017/harness/run_concurrency_campaign.py \
            --worker .build/rcs017/rcs017_concurrency_probe \
            --profile stress \
            --out-dir .results/rcs017-stress
      - name: Validate measured RCS-017 evidence
        run: python3 tools/validate_rcs017.py --results-dir .results/rcs017-stress
      - name: Upload RCS-017 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs017-concurrency-stress
          path: .results/rcs017-stress
          if-no-files-found: error
