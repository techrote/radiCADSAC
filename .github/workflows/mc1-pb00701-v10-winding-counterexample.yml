name: MC-038 V10 source-bound winding counterexample

on:
  push:
    branches:
      - research/mc038-v10-winding-endpoint-refusal-20261106
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701-v10-winding-counterexample-20261106.py
      - research/machining-completeness/tasks/MC-038/pb00701-v10-winding-counterexample-20261106.json
      - research/machining-completeness/tasks/MC-038/pb00701-v10-winding-counterexample-20261106.md
      - .github/workflows/mc1-pb00701-v10-winding-counterexample.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bound-winding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal source head custody
        shell: bash
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen original proof, sign cells and adversarial controls
        run: python3 research/machining-completeness/tasks/MC-038/pb00701-v10-winding-counterexample-20261106.py --contract --self-test

  frozen-original-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal source head custody
        shell: bash
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full unchanged frozen V54/V2 producing reconciliation
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract

  static-programme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal source head custody
        shell: bash
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: MC-1 static authority validation
        run: python3 tools/validate_machining_completeness.py
