name: mc1-pb00701-v24
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_mixed_quadrature_phase_anchor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_mixed_quadrature_phase_anchor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v24.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-mixed-quadrature-phase-anchor-boundary-v24.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v24.md'
      - 'docs/machining-completeness/50-PB00701-MIXED-QUADRATURE-PHASE-ANCHOR.md'
      - '.github/workflows/mc1-pb00701-v24.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_mixed_quadrature_phase_anchor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_mixed_quadrature_phase_anchor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v24.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-mixed-quadrature-phase-anchor-boundary-v24.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v24.md'
      - 'docs/machining-completeness/50-PB00701-MIXED-QUADRATURE-PHASE-ANCHOR.md'
      - '.github/workflows/mc1-pb00701-v24.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v24 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_mixed_quadrature_phase_anchor_model.py research/machining-completeness/tasks/MC-038/test_pb00701_mixed_quadrature_phase_anchor_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v24.py
      - name: Verify PB-007-01 v24 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v24.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v24.py --self-test
