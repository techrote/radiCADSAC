name: mc1-mc047-capture-descriptor-custody

on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-045/campaign_harness.py'
      - 'research/machining-completeness/tasks/MC-047/capture_descriptor_custody_qualification.py'
      - 'research/machining-completeness/tasks/MC-047/capture-descriptor-custody-20261105.md'
      - '.github/workflows/mc1-mc047-capture-descriptor-custody.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-045/campaign_harness.py'
      - 'research/machining-completeness/tasks/MC-047/capture_descriptor_custody_qualification.py'
      - '.github/workflows/mc1-mc047-capture-descriptor-custody.yml'

permissions:
  contents: read

jobs:
  descriptor-custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify literal source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Source $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile actual audited source and qualification
        shell: bash
        run: |
          python -m py_compile research/machining-completeness/tasks/MC-045/campaign_harness.py research/machining-completeness/tasks/MC-047/capture_descriptor_custody_qualification.py research/machining-completeness/tasks/MC-047/verify.py
      - name: Descriptor-pinned same-digest substitution and mutation controls
        shell: bash
        run: |
          python research/machining-completeness/tasks/MC-047/capture_descriptor_custody_qualification.py --contract
      - name: Accepted MC-045 and MC-047 regression controls
        shell: bash
        run: |
          python research/machining-completeness/tasks/MC-045/campaign_harness.py self-test
          python research/machining-completeness/tasks/MC-047/verify.py --contract
