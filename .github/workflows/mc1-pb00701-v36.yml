      - name: Compile PB-007-01 v36 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_phase_correlated_varying_ratio_shared_factor_model.py research/machining-completeness/tasks/MC-038/test_pb00701_phase_correlated_varying_ratio_shared_factor_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v36.py
      - name: Verify PB-007-01 v36 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v36.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v36.py --self-test
