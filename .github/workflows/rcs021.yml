name: rcs021-manual-freehand-mill-oracle

on:
  push:
    branches: [main]
    # MC-1 planning-only changes must not dispatch historical campaigns on merge.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - 'tools/validate_bootstrap_consistency.py'
      - '.github/workflows/**'
  pull_request:
    # MC-1 planning-only impact routing: native historical campaigns are not
    # evidence for documentation/registry adoption and must not be dispatched by it.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_bootstrap_consistency.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-rcs021:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned external comparator
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: manifold3d==3.5.3
      - name: Validate RCS-021 static research contracts
        run: python3 tools/validate_rcs021.py
      - name: Compile RCS-021 Python harness
        run: python3 -m py_compile research/rcs-021/*.py
      - name: Run representation-only bounded campaign
        run: |
          python3 research/rcs-021/run_campaign.py \
            --profile ci \
            --repeats 2 \
            --out-dir .results/rcs021-material
      - name: Validate representation-only evidence
        run: python3 tools/validate_rcs021.py --results-dir .results/rcs021-material
      - name: Upload representation-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs021-material-oracle-directional-external
          path: .results/rcs021-material
          if-no-files-found: error

  rcs021-occt-revisit:
    needs: validate-rcs021
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RCS006_OCCT_PREFIX: ${{ github.workspace }}/.deps/rcs006/occt-8.0.1
      RCS006_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned external comparator
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: manifold3d==3.5.3
      - name: Restore pinned OCCT cache
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}
      - name: Install cold-bootstrap/build prerequisites
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Ensure Ninja is available on cache hit
        if: steps.occt-cache.outputs.cache-hit == 'true'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
      - name: Bootstrap exact OCCT baseline if required
        run: bash research/rcs-006/harness/bootstrap_occt.sh
      - name: Verify exact OCCT baseline
        run: bash research/rcs-006/harness/verify_occt_install.sh
      - name: Configure RCS-011 mill comparator
        run: |
          cmake -S research/rcs-011/harness -B .build/rcs011 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RCS006_OCCT_PREFIX"
      - name: Build RCS-011 mill comparator
        run: cmake --build .build/rcs011 --parallel 2
      - name: Run full RCS-021 campaign and bounded RCS-011 revisit
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RCS006_OCCT_PREFIX/lib:$RCS006_OCCT_PREFIX/lib64:${LD_LIBRARY_PATH:-}"
          python3 research/rcs-021/run_campaign.py \
            --profile ci \
            --repeats 2 \
            --rcs011-worker .build/rcs011/rcs011_mill_worker \
            --out-dir .results/rcs021
      - name: Validate full measured RCS-021 evidence
        run: python3 tools/validate_rcs021.py --results-dir .results/rcs021
      - name: Upload full RCS-021 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs021-manual-freehand-mill-oracle
          path: .results/rcs021
          if-no-files-found: error
