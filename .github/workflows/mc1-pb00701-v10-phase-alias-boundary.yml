name: mc1-pb00701-v10-phase-alias-boundary

on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v10_phase_alias_boundary.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v10-phase-alias-boundary-20261105.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v10-phase-alias-boundary-20261105.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation-v2.json'
      - '.github/workflows/mc1-pb00701-v10-phase-alias-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v10_phase_alias_boundary.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v10-phase-alias-boundary-20261105.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v10-phase-alias-boundary-20261105.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation-v2.json'
      - '.github/workflows/mc1-pb00701-v10-phase-alias-boundary.yml'

permissions:
  contents: read

jobs:
  original-v10-phase-alias-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact Git source head
        run: |
          echo "checked-out=$(git rev-parse HEAD) expected=${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Original V10 frozen-source/census and 21 adversarial controls
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/pb00701_v10_phase_alias_boundary.py --contract --self-test
      - name: Complete original-source v54/v2 producing replay
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract
      - name: MC-1 programme and source static checks
        run: |
          set -euo pipefail
          python3 tools/validate_machining_completeness.py
