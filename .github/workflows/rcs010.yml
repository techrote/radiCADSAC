name: rcs010-lathe-research

on:
  push:
    branches: [main]
    # MC-1 planning-only changes must not dispatch historical campaigns on merge.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - 'tools/validate_bootstrap_consistency.py'
      - '.github/workflows/**'
  pull_request:
    # MC-1 planning-only impact routing: native historical campaigns are not
    # evidence for documentation/registry adoption and must not be dispatched by it.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_bootstrap_consistency.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-rcs010:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate RCS-010 research contracts
        run: python3 tools/validate_rcs010.py

  lathe-strategy-smoke:
    needs: validate-rcs010
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RCS006_OCCT_PREFIX: ${{ github.workspace }}/.deps/rcs006/occt-8.0.1
      RCS006_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore pinned OCCT cache
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/rcs006/occt-8.0.1
          key: rcs006-occt-8.0.1-${{ runner.os }}-${{ hashFiles('research/rcs-006/harness/bootstrap_occt.sh') }}
      - name: Install cold-bootstrap/build prerequisites
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Ensure Ninja is available on cache hit
        if: steps.occt-cache.outputs.cache-hit == 'true'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
      - name: Bootstrap exact OCCT baseline if required
        run: bash research/rcs-006/harness/bootstrap_occt.sh
      - name: Verify exact OCCT baseline
        run: bash research/rcs-006/harness/verify_occt_install.sh
      - name: Configure RCS-010 worker
        run: |
          cmake -S research/rcs-010/harness -B .build/rcs010 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RCS006_OCCT_PREFIX"
      - name: Build RCS-010 worker
        run: cmake --build .build/rcs010 --parallel 2
      - name: Run RCS-010 smoke campaign
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RCS006_OCCT_PREFIX/lib:$RCS006_OCCT_PREFIX/lib64:${LD_LIBRARY_PATH:-}"
          python3 research/rcs-010/harness/run_lathe_campaign.py \
            --worker .build/rcs010/rcs010_lathe_worker \
            --profile smoke \
            --out-dir .results/rcs010-smoke
      - name: Validate measured RCS-010 evidence
        run: python3 tools/validate_rcs010.py --results-dir .results/rcs010-smoke
      - name: Upload RCS-010 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs010-lathe-material-domain-smoke
          path: .results/rcs010-smoke
          if-no-files-found: error
