name: mc-adoption-review-snapshot
on:
  push:
    branches: [mc-1-workflow-adoption]
    paths: [.github/workflows/mc-adoption-review-snapshot.yml]
permissions:
  contents: read
  issues: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Snapshot exact source and current planning metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/mc-review
          git archive --format=tar.gz --output=/tmp/mc-review/source.tar.gz HEAD
          git bundle create /tmp/mc-review/source.bundle --all
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          base='https://api.github.com/repos/techrote/radiCADSAC/'
          def get(path):
              r=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(r,timeout=30) as response: return json.load(response)
          def pages(path):
              rows=[]
              for page in range(1,20):
                  part=get(path+('&' if '?' in path else '?')+f'per_page=100&page={page}')
                  rows.extend(part)
                  if len(part)<100: return rows
              raise RuntimeError('Pagination safety bound exceeded')
          issues=pages('issues?state=all')
          result={'source':os.environ['GITHUB_SHA'],'main':get('git/ref/heads/main'),'branch':get('git/ref/heads/mc-1-workflow-adoption'),'issues':issues,'milestones':pages('milestones?state=all'),'labels':pages('labels'),'comments':{str(i['number']):pages(f"issues/{i['number']}/comments") for i in issues if i['comments']}}
          pathlib.Path('/tmp/mc-review/github.json').write_text(json.dumps(result,indent=2)+'\n')
          print('Source',result['source'],'issues/PRs',len(issues),'milestones',len(result['milestones']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-adoption-review-snapshot
          path: /tmp/mc-review/
          if-no-files-found: error
          retention-days: 14
