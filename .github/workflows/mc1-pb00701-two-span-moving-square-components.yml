name: mc1-pb00701-two-span-moving-square-components

on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_two_span_moving_square_components.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_two_span_moving_square_components.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-two-span-moving-square-components-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-two-span-moving-square-components.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation-v2.json'
      - '.github/workflows/mc1-pb00701-two-span-moving-square-components.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_two_span_moving_square_components.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_two_span_moving_square_components.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-two-span-moving-square-components-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-two-span-moving-square-components.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation-v2.json'
      - '.github/workflows/mc1-pb00701-two-span-moving-square-components.yml'

permissions:
  contents: read

jobs:
  original-moving-square-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Literal source and provenance identity
        run: |
          echo "Checked out exact commit $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Original two-span theorem and 20 adversarial tests
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/pb00701_two_span_moving_square_components.py --contract
          python3 research/machining-completeness/tasks/MC-038/test_pb00701_two_span_moving_square_components.py
      - name: Independent complete 50-original-source proof replay
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract
      - name: MC-1 authority and source static validation
        run: |
          set -euo pipefail
          python3 tools/validate_machining_completeness.py
