name: MC-1 PB-007-03 exact F07 rigid-pose source lowering

on:
  push:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00703_rigid_pose_20261109.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00703_rigid_pose_20261109.py'
      - 'research/machining-completeness/tasks/MC-038/pb00703-rigid-pose-20261109.md'
      - '.github/workflows/mc1-pb00703-rigid-pose.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00703_rigid_pose_20261109.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00703_rigid_pose_20261109.py'
      - 'research/machining-completeness/tasks/MC-038/pb00703-rigid-pose-20261109.md'
      - '.github/workflows/mc1-pb00703-rigid-pose.yml'

permissions:
  contents: read

jobs:
  exact-original-f07:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source transform and original F07 independent controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/pb00703_rigid_pose_20261109.py --contract
          python3 research/machining-completeness/tasks/MC-038/test_pb00703_rigid_pose_20261109.py --self-test
      - name: Programme invariants and negative authority controls
        run: python3 tools/validate_machining_completeness.py --self-test
