name: mc1-pb00701-v17-signed-nonlattice

on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v17_signed_nonlattice.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v17-signed-nonlattice-20261105.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v17-signed-nonlattice-20261105.md'
      - '.github/workflows/mc1-pb00701-v17-signed-nonlattice.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v17_signed_nonlattice.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v17-signed-nonlattice-20261105.json'
      - '.github/workflows/mc1-pb00701-v17-signed-nonlattice.yml'

permissions:
  contents: read

jobs:
  signed-nonlattice-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Authenticate literal source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Original V17 exact source and adversarial proof
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v17_signed_nonlattice.py --contract --self-test
      - name: Complete fifty-original v2 proof replay
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract
      - name: MC-1 static programme validation
        run: python3 tools/validate_machining_completeness.py
