name: mc1-pb00701-v33
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_pointwise_separator_integration_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_pointwise_separator_integration_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v33.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-pointwise-separator-integration-v33.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v33.md'
      - 'docs/machining-completeness/59-PB00701-POINTWISE-SEPARATOR-INTEGRATION.md'
      - '.github/workflows/mc1-pb00701-v33.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_pointwise_separator_integration_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_pointwise_separator_integration_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v33.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-pointwise-separator-integration-v33.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v33.md'
      - 'docs/machining-completeness/59-PB00701-POINTWISE-SEPARATOR-INTEGRATION.md'
      - '.github/workflows/mc1-pb00701-v33.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v33 pointwise integration
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_pointwise_separator_integration_model.py research/machining-completeness/tasks/MC-038/test_pb00701_pointwise_separator_integration_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v33.py
      - name: Verify PB-007-01 v33 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v33.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v33.py --self-test
