name: rcs025-provider-handoff-stress

on:
  push:
    branches: [main]
    # MC-1 planning-only changes must not dispatch historical campaigns on merge.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - 'tools/validate_bootstrap_consistency.py'
      - '.github/workflows/**'
  pull_request:
    # MC-1 planning-only impact routing: native historical campaigns are not
    # evidence for documentation/registry adoption and must not be dispatched by it.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_bootstrap_consistency.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-rcs025:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static RCS-025 contracts
        run: python3 tools/validate_rcs025.py
      - name: Compile research harness
        run: python3 -m py_compile research/rcs-025/*.py
      - name: Run adversarial and boundary tests
        run: python3 -m unittest discover -v -s research/rcs-025 -p 'test_*.py'
      - name: Run deterministic handoff/reconciliation campaign
        run: |
          python3 research/rcs-025/run_campaign.py \
            --out-dir .results/rcs025 \
            --compare-reference research/rcs-025/reference-results-v1.json
      - name: Validate live evidence against frozen reference
        run: python3 tools/validate_rcs025.py --results-dir .results/rcs025
      - name: Upload RCS-025 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs025-provider-handoff-stress
          path: .results/rcs025
          if-no-files-found: error
