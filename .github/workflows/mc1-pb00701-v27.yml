name: mc1-pb00701-v27
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_phase_sector_partition_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_phase_sector_partition_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v27.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-phase-sector-partition-boundary-v27.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v27.md'
      - 'docs/machining-completeness/53-PB00701-PHASE-SECTOR-PARTITION.md'
      - '.github/workflows/mc1-pb00701-v27.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_phase_sector_partition_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_phase_sector_partition_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v27.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-phase-sector-partition-boundary-v27.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v27.md'
      - 'docs/machining-completeness/53-PB00701-PHASE-SECTOR-PARTITION.md'
      - '.github/workflows/mc1-pb00701-v27.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v27 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_phase_sector_partition_model.py research/machining-completeness/tasks/MC-038/test_pb00701_phase_sector_partition_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v27.py
      - name: Verify PB-007-01 v27 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v27.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v27.py --self-test
