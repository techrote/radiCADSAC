name: MC-1 PB-007-03 original F08 curved source lowering

on:
  push:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00703_f08_capsule_source_20261109.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00703_f08_capsule_source_20261109.py'
      - 'research/machining-completeness/tasks/MC-038/pb00703-f08-capsule-source-20261109.md'
      - '.github/workflows/mc1-pb00703-f08-capsule-source.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00703_f08_capsule_source_20261109.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00703_f08_capsule_source_20261109.py'
      - 'research/machining-completeness/tasks/MC-038/pb00703-f08-capsule-source-20261109.md'
      - '.github/workflows/mc1-pb00703-f08-capsule-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Preserve immutable historical Git-blob bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original fixture, v4 source constructor and 9 independent controls
        run: |
          python research/machining-completeness/tasks/MC-038/pb00703_f08_capsule_source_20261109.py --contract
          python research/machining-completeness/tasks/MC-038/test_pb00703_f08_capsule_source_20261109.py --self-test
      - name: Programme invariants and negative authority controls
        run: python tools/validate_machining_completeness.py --self-test
