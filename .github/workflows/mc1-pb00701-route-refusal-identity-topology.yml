name: mc1-pb00701-route-refusal-identity-topology
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_route_refusal_identity_topology_audit.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_frontier.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_affine_identity_frontier.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_coupled_bspline_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_rational_turn_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_event_model.py'
      - 'research/machining-completeness/tasks/MC-032/event_engine.py'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-route-refusal-identity-topology.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_route_refusal_identity_topology_audit.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_frontier.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_affine_identity_frontier.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_coupled_bspline_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_rational_turn_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_event_model.py'
      - 'research/machining-completeness/tasks/MC-032/event_engine.py'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-route-refusal-identity-topology.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show literal source head
        run: git rev-parse HEAD
      - name: Classify all 20 frozen route-refused original sources
        run: |
          python3 research/machining-completeness/tasks/MC-038/pb00701_route_refusal_identity_topology_audit.py --contract --self-test
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_frontier.py --contract --self-test
