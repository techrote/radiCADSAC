name: mc1-pb00701-v22
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_phase_sector_anchor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_phase_sector_anchor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v22.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-phase-sector-anchor-boundary-v22.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v22.md'
      - 'docs/machining-completeness/48-PB00701-PHASE-SECTOR-PARTIAL-DERIVATIVE-ANCHOR.md'
      - '.github/workflows/mc1-pb00701-v22.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_phase_sector_anchor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_phase_sector_anchor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v22.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-phase-sector-anchor-boundary-v22.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v22.md'
      - 'docs/machining-completeness/48-PB00701-PHASE-SECTOR-PARTIAL-DERIVATIVE-ANCHOR.md'
      - '.github/workflows/mc1-pb00701-v22.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v22 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_phase_sector_anchor_model.py research/machining-completeness/tasks/MC-038/test_pb00701_phase_sector_anchor_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v22.py
      - name: Verify PB-007-01 v22 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v22.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v22.py --self-test
