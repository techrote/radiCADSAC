name: mc1-pb00701-v21
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_l1_sign_orthant_envelope_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_l1_sign_orthant_envelope_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v21.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-l1-sign-orthant-envelope-boundary-v21.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v21.md'
      - 'docs/machining-completeness/47-PB00701-L1-SIGN-ORTHANT-DERIVATIVE-ENVELOPE.md'
      - '.github/workflows/mc1-pb00701-v21.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_l1_sign_orthant_envelope_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_l1_sign_orthant_envelope_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v21.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-l1-sign-orthant-envelope-boundary-v21.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v21.md'
      - 'docs/machining-completeness/47-PB00701-L1-SIGN-ORTHANT-DERIVATIVE-ENVELOPE.md'
      - '.github/workflows/mc1-pb00701-v21.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v21 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_l1_sign_orthant_envelope_model.py research/machining-completeness/tasks/MC-038/test_pb00701_l1_sign_orthant_envelope_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v21.py
      - name: Verify PB-007-01 v21 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v21.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v21.py --self-test
