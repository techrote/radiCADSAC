name: MC-038 octant-node oriented H1 physical-event certificate
on:
  push:
    branches:
      - research/mc038-v12-octant-oriented-events-20261106
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701_h1_octant_event_20261106.py
      - research/machining-completeness/tasks/MC-038/pb00701-h1-octant-event-20261106.md
      - .github/workflows/mc1-pb00701-h1-octant-event.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  octant-original-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal checkout identity
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen original exact octant proof and seven negative controls
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_h1_octant_event_20261106.py --contract --self-test

  original-v54-v2-producing-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal checkout identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Complete historical 50-source producing replay
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract

  mc1-authority-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal checkout identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: MC-1 current-authority and static validation
        run: python3 tools/validate_machining_completeness.py
