name: mc1-pb00701-v32
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_algebraic_separator_exact.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_algebraic_separator_foundation_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_separator_foundation_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v32.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-algebraic-separator-foundation-v32.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v32.md'
      - 'docs/machining-completeness/58-PB00701-ALGEBRAIC-SEPARATOR-FOUNDATION.md'
      - '.github/workflows/mc1-pb00701-v32.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_algebraic_separator_exact.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_algebraic_separator_foundation_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_separator_foundation_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v32.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-algebraic-separator-foundation-v32.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v32.md'
      - 'docs/machining-completeness/58-PB00701-ALGEBRAIC-SEPARATOR-FOUNDATION.md'
      - '.github/workflows/mc1-pb00701-v32.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v32 exact algebraic foundation
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_algebraic_separator_exact.py research/machining-completeness/tasks/MC-038/pb00701_algebraic_separator_foundation_model.py research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_separator_foundation_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v32.py
      - name: Verify PB-007-01 v32 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v32.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v32.py --self-test
