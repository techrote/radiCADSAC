name: mc1-pb00701-bernstein-sector-source
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_bernstein_sector_source_witnesses.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_bernstein_sector_source_witnesses.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-bernstein-sector-source-witnesses.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-bernstein-sector-source-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-inventory-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-coverage-v54.json'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_frontier.py'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'research/machining-completeness/programme-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-bernstein-sector-source.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_bernstein_sector_source_witnesses.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_bernstein_sector_source_witnesses.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-bernstein-sector-source-witnesses.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-bernstein-sector-source-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-inventory-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-coverage-v54.json'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_frontier.py'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'research/machining-completeness/programme-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-bernstein-sector-source.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record literal source head
        run: git rev-parse HEAD
      - name: Replay original Bernstein and phase-sector proofs
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_bernstein_sector_source_witnesses.py --contract --self-test
      - name: Preserve the complete historical census and negative controls
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_frontier.py --contract --self-test
