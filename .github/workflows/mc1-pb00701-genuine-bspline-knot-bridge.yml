name: MC-038 genuine B-spline source-knot H1/H2 event bridge

on:
  push:
    branches:
      - research/mc038-genuine-bspline-knot-bridge-20261108
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701_genuine_bspline_knot_bridge_20261108.py
      - research/machining-completeness/tasks/MC-038/pb00701-genuine-bspline-knot-bridge-20261108.md
      - .github/workflows/mc1-pb00701-genuine-bspline-knot-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-genuine-bspline-knot-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact committed source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-authenticated spline and event proof tests
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_genuine_bspline_knot_bridge_20261108.py --contract --self-test
      - name: Inherited complete second-order physical event proof
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_generic_second_order_boundary_20261108.py --contract --self-test
      - name: Inherited zero-knot and complete generic interval proofs
        run: |
          python3 research/machining-completeness/tasks/MC-038/pb00701_generic_zero_knot_extension_20261108.py --contract --self-test
          python3 research/machining-completeness/tasks/MC-038/pb00701_generic_interval_events_20261108.py --contract --self-test

  frozen-v54-v2-producing-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact committed source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reexecute complete frozen original evidence and custody
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract

  mc1-static-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact committed source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate existing MC-1 proof and programme authority
        run: python3 tools/validate_machining_completeness.py
