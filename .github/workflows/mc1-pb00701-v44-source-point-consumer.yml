          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-bound V44 rational-point consumer (nonpromotion)
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v44_source_point_consumer.py --contract --self-test
