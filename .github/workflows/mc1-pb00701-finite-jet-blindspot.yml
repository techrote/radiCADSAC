name: mc1-pb00701-finite-jet-blindspot
on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_finite_jet_blindspot.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_finite_jet_blindspot.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-jet-blindspot.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-jet-blindspot-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation-v2.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-finite-jet-blindspot.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_finite_jet_blindspot.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_finite_jet_blindspot.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-jet-blindspot.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-jet-blindspot-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation-v2.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-finite-jet-blindspot.yml'
permissions:
  contents: read
jobs:
  finite-jet-blindspot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Original-source exact Bernstein proof, adversarial tests and pinned historical census
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_finite_jet_blindspot.py --contract --self-test
      - name: Independent post-v54 fifty-source producer reconciliation
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract
