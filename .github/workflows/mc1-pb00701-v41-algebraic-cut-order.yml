name: mc1-pb00701-v41-algebraic-cut-order
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v41_algebraic_cut_order.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v41_algebraic_cut_order.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v41-algebraic-cut-order-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701_coupled_bspline_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_orientation_root_partition_model.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_stationary_polynomial_order.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-v41-algebraic-cut-order.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v41_algebraic_cut_order.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v41_algebraic_cut_order.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v41-algebraic-cut-order-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701_coupled_bspline_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_orientation_root_partition_model.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_stationary_polynomial_order.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-v41-algebraic-cut-order.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact V41 implicit proof-cut equality/order research
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v41_algebraic_cut_order.py --contract --self-test
