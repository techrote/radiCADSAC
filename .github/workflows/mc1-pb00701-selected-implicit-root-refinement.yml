permissions:
  contents: read

concurrency:
  group: mc1-selected-implicit-root-refinement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selected-implicit-root-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record literal tested revision
        run: git rev-parse HEAD
      - name: Fresh selected implicit refinement and substantive falsifiers
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_selected_implicit_root_refinement.py --contract --self-test
      - name: Preserve frozen post-V54 frontier contract
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_frontier.py --contract --self-test
