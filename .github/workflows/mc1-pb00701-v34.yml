name: mc1-pb00701-v34
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_phase_correlated_common_factor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_phase_correlated_common_factor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v34.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-phase-correlated-common-factor-v34.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v34.md'
      - 'docs/machining-completeness/60-PB00701-PHASE-CORRELATED-COMMON-FACTOR.md'
      - '.github/workflows/mc1-pb00701-v34.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_phase_correlated_common_factor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_phase_correlated_common_factor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v34.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-phase-correlated-common-factor-v34.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v34.md'
      - 'docs/machining-completeness/60-PB00701-PHASE-CORRELATED-COMMON-FACTOR.md'
      - '.github/workflows/mc1-pb00701-v34.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v34 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_phase_correlated_common_factor_model.py research/machining-completeness/tasks/MC-038/test_pb00701_phase_correlated_common_factor_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v34.py
      - name: Verify PB-007-01 v34 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v34.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v34.py --self-test
