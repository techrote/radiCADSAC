name: MC-045 retained-capture inventory bounded admission

on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-045/campaign_harness.py'
      - 'research/machining-completeness/tasks/MC-045/retained-capture-inventory-bound-20261106.md'
      - '.github/workflows/mc045-retained-inventory-bound-20261106.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  literal-head-model-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      # MC-045 verifies exact Git blob bytes. Windows checkout may otherwise
      # CRLF-convert pinned JSON dependencies and produce false source drift.
      - name: Preserve source blob bytes on both platforms
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact submitted source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          printf 'EXPECTED_HEAD=%s\nACTUAL_HEAD=%s\n' "$EXPECTED_HEAD" "$ACTUAL_HEAD"
          test "$EXPECTED_HEAD" = "$ACTUAL_HEAD"
      - name: Exercise accepted MC-045 harness and surplus inventory refusal
        run: python research/machining-completeness/tasks/MC-045/campaign_harness.py self-test
      - name: Exercise MC-045 contract and source qualification
        run: python research/machining-completeness/tasks/MC-045/verify.py --self-test
