          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact V27 endpoint multiplicity shadow composition
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v27_endpoint_multiplicity.py --contract --self-test
