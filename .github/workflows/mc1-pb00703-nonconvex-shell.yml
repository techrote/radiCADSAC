name: MC-038 PB-007-03 exact nonconvex source shell
on:
  push:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00703_nonconvex_shell_20261109.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00703_nonconvex_20261109.py'
      - '.github/workflows/mc1-pb00703-nonconvex-shell.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00703_nonconvex_shell_20261109.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00703_nonconvex_20261109.py'
      - '.github/workflows/mc1-pb00703-nonconvex-shell.yml'
  workflow_dispatch:
jobs:
  source-certificates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record literal source head
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact original-source contract
        run: python research/machining-completeness/tasks/MC-038/verify_pb00703_nonconvex_20261109.py --contract
      - name: Exact nonconvex physical membership and negative adversaries
        run: python research/machining-completeness/tasks/MC-038/verify_pb00703_nonconvex_20261109.py --self-test
      - name: MC-1 static authority and frozen programme audit
        run: python tools/validate_machining_completeness.py
