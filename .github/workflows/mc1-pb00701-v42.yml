name: mc1-pb00701-v42
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_orientation_transition_bridge_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_orientation_transition_bridge_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v42.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-orientation-transition-v42.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v42.md'
      - 'docs/machining-completeness/67-PB00701-ORIENTATION-TRANSITION-DERIVATIVE-BRIDGE.md'
      - '.github/workflows/mc1-pb00701-v42.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_orientation_transition_bridge_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_orientation_transition_bridge_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v42.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-orientation-transition-v42.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v42.md'
      - 'docs/machining-completeness/67-PB00701-ORIENTATION-TRANSITION-DERIVATIVE-BRIDGE.md'
      - '.github/workflows/mc1-pb00701-v42.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v42 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_orientation_transition_bridge_model.py research/machining-completeness/tasks/MC-038/test_pb00701_orientation_transition_bridge_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v42.py
      - name: Verify PB-007-01 v42 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v42.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v42.py --self-test
