name: mc1-pb00701-v42

on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_orientation_transition_bridge_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_orientation_transition_bridge_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v42.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-orientation-transition-v42.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v42.md'
      - 'docs/machining-completeness/67-PB00701-ORIENTATION-TRANSITION-DERIVATIVE-BRIDGE.md'
      - '.github/workflows/mc1-pb00701-v42.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-v42:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile v42 exact model and adversarial suite
        run: |
          python3 -m py_compile \
            research/machining-completeness/tasks/MC-038/pb00701_orientation_transition_bridge_model.py \
            research/machining-completeness/tasks/MC-038/test_pb00701_orientation_transition_bridge_adversarial.py \
            research/machining-completeness/tasks/MC-038/verify_pb00701_v42.py
      - name: Run v42 adversarial and boundary suite
        run: python3 research/machining-completeness/tasks/MC-038/test_pb00701_orientation_transition_bridge_adversarial.py
      - name: Verify v42 publication contract
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v42.py --contract
      - name: Run v42 verifier self-test
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v42.py --self-test
      - name: Preserve v40 regression authority
        run: python3 research/machining-completeness/tasks/MC-038/test_pb00701_signed_b_anti_diagonal_adversarial.py
