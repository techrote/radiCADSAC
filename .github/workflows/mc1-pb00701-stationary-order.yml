name: mc1-pb00701-stationary-order
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_stationary_polynomial_order.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-stationary-polynomial-order-research.md'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_affine_identity_frontier.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701_coupled_bspline_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_rational_turn_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_event_model.py'
      - 'research/machining-completeness/tasks/MC-032/event_engine.py'
      - '.github/workflows/mc1-pb00701-stationary-order.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_stationary_polynomial_order.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-stationary-polynomial-order-research.md'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_affine_identity_frontier.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701_coupled_bspline_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_rational_turn_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_event_model.py'
      - 'research/machining-completeness/tasks/MC-032/event_engine.py'
      - '.github/workflows/mc1-pb00701-stationary-order.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact stationary polynomial ordered-root research
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_stationary_polynomial_order.py --contract --self-test
