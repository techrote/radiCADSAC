name: rcs012-alternative-hybrid

on:
  push:
    branches: [main]
    # MC-1 planning-only changes must not dispatch historical campaigns on merge.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - 'tools/validate_bootstrap_consistency.py'
      - '.github/workflows/**'
  pull_request:
    # MC-1 planning-only impact routing: native historical campaigns are not
    # evidence for documentation/registry adoption and must not be dispatched by it.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/validate_bootstrap_consistency.py'
      - 'tools/validate_mc_ci_impact.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-rcs012-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate RCS-012 static research contracts
        run: python3 tools/validate_rcs012.py

  rcs012-alternative-hybrid-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run deterministic alternative-representation campaign
        run: |
          python3 research/rcs-012/harness/run_campaign.py \
            --out-dir .results/rcs012 \
            --repeats 2
      - name: Validate runtime evidence
        run: python3 tools/validate_rcs012.py --results-dir .results/rcs012
      - name: Upload RCS-012 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcs012-alternative-hybrid-evidence
          path: .results/rcs012
          if-no-files-found: error
