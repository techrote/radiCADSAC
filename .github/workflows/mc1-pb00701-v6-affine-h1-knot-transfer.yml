name: MC-038 V6 distinct affine-H1 true-knot signed transfer research

on:
  push:
    branches:
      - research/mc038-v6-affine-h1-knot-sign-transfer-20261107
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701_v6_affine_h1_knot_transfer_20261107.py
      - research/machining-completeness/tasks/MC-038/pb00701-v6-affine-h1-knot-transfer-20261107.md
      - research/machining-completeness/tasks/MC-038/pb00701-v6-affine-h1-knot-transfer-20261107.json
      - .github/workflows/mc1-pb00701-v6-affine-h1-knot-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-distinct-h1-theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify literal head
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute pinned different-H1 event theorem and adversarial controls
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_v6_affine_h1_knot_transfer_20261107.py --contract --self-test

  historical-v54-v2-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify literal head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full producing V54/V2 source-evidence reconciliation
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract

  mc1-static-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify literal head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: MC-1 programme static validation
        run: python3 tools/validate_machining_completeness.py
