name: rcs015-handoff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-msac-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate RCS-015 MSAC handoff
        run: python3 tools/validate_rcs015.py
