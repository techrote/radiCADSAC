name: RCS-013 architecture synthesis

on:
  push:
    branches: [main]
  pull_request:
    # MC-1 planning-only impact routing: native historical campaigns are not
    # evidence for documentation/registry adoption and must not be dispatched by it.
    paths-ignore:
      - 'docs/machining-completeness/**'
      - 'docs/decisions/DR-0026-machining-completeness-programme.md'
      - 'research/machining-completeness/**'
      - 'handoffs/current-authority.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'handoffs/README.md'
      - 'tools/validate_machining_completeness.py'
      - 'tools/mc_workflow.py'
      - 'tools/mc_inventory.py'
      - '.github/workflows/**'
    paths:
      - 'docs/20-OPENSIMACHINIST-ARCHITECTURE-SYNTHESIS.md'
      - 'docs/decisions/DR-0015-gate-2-semantic-provider-hybrid-architecture.md'
      - 'research/rcs-013/**'
      - 'tools/validate_rcs013.py'
      - 'README.md'
      - '.github/workflows/rcs013-architecture.yml'

permissions:
  contents: read

jobs:
  validate-rcs013:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate RCS-013 architecture synthesis
        run: python3 tools/validate_rcs013.py
