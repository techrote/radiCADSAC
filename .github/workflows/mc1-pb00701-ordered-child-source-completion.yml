name: mc1-pb00701-ordered-child-source-completion
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_ordered_child_source_completion.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_ordered_child_source_completion.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-ordered-child-source-completion-*'
      - 'research/machining-completeness/tasks/MC-038/pb00701_coupled_bspline_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_rational_turn_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_event_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_transverse_trig_interval.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-inventory-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-coverage-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation.json'
      - 'research/machining-completeness/tasks/MC-032/event_engine.py'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'research/machining-completeness/programme-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-ordered-child-source-completion.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_ordered_child_source_completion.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_ordered_child_source_completion.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-ordered-child-source-completion-*'
      - 'research/machining-completeness/tasks/MC-038/pb00701_coupled_bspline_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_rational_turn_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_event_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_transverse_trig_interval.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-inventory-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-coverage-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation.json'
      - 'research/machining-completeness/tasks/MC-032/event_engine.py'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'research/machining-completeness/programme-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-ordered-child-source-completion.yml'
permissions:
  contents: read
jobs:
  original-source-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record literal source head
        run: git rev-parse HEAD
      - name: Reexecute both original spans and adversarial composition checks
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_ordered_child_source_completion.py --contract --self-test
