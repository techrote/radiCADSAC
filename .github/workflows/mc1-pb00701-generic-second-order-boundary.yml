name: MC-038 moving H1/H2 second-order boundary certification

on:
  push:
    branches:
      - research/mc038-h1h2-boundary-second-order-20261108
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701_generic_second_order_boundary_20261108.py
      - research/machining-completeness/tasks/MC-038/pb00701-generic-second-order-boundary-20261108.md
      - .github/workflows/mc1-pb00701-generic-second-order-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-second-order-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require literal head checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Second-order complete event contract and adversarial cases
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_generic_second_order_boundary_20261108.py --contract --self-test
      - name: Upstream first-order guard contract
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_generic_zero_knot_extension_20261108.py --contract --self-test
      - name: Upstream complete generic source contract
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_generic_interval_events_20261108.py --contract --self-test

  original-v54-v2-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Complete historical original-source replay
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract

  mc1-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate unchanged programme/proof authority
        run: python3 tools/validate_machining_completeness.py
