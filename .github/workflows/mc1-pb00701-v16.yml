name: mc1-pb00701-v16
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_chebyshev_multiplier_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_chebyshev_multiplier_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v16.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-chebyshev-sturm-boundary-v16.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v16.md'
      - 'docs/machining-completeness/42-PB00701-CHEBYSHEV-STURM-MULTIPLIER.md'
      - '.github/workflows/mc1-pb00701-v16.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_chebyshev_multiplier_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_chebyshev_multiplier_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v16.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-chebyshev-sturm-boundary-v16.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v16.md'
      - 'docs/machining-completeness/42-PB00701-CHEBYSHEV-STURM-MULTIPLIER.md'
      - '.github/workflows/mc1-pb00701-v16.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v16 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_chebyshev_multiplier_model.py research/machining-completeness/tasks/MC-038/test_pb00701_chebyshev_multiplier_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v16.py
      - name: Verify PB-007-01 v16 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v16.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v16.py --self-test
