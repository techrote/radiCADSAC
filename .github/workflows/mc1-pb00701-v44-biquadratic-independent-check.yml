name: mc1-pb00701-v44-biquadratic-independent-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_biquadratic_independent_check.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v44-biquadratic-independent-check-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_two_quadratic_cut_restriction.py'
      - '.github/workflows/mc1-pb00701-v44-biquadratic-independent-check.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_biquadratic_independent_check.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v44-biquadratic-independent-check-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_two_quadratic_cut_restriction.py'
      - '.github/workflows/mc1-pb00701-v44-biquadratic-independent-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show literal source head
        run: git rev-parse HEAD
      - name: Independent fixed field isqrt, multiplication and Gaussian inverse challenges
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_v44_biquadratic_independent_check.py --contract --self-test
