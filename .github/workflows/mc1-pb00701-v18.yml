name: mc1-pb00701-v18
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_source_laurent_factor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_source_laurent_factor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v18.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-source-laurent-module-boundary-v18.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v18.md'
      - 'docs/machining-completeness/44-PB00701-SOURCE-LAURENT-MODULE-FACTORIZATION.md'
      - '.github/workflows/mc1-pb00701-v18.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_source_laurent_factor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_source_laurent_factor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v18.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-source-laurent-module-boundary-v18.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v18.md'
      - 'docs/machining-completeness/44-PB00701-SOURCE-LAURENT-MODULE-FACTORIZATION.md'
      - '.github/workflows/mc1-pb00701-v18.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v18 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_source_laurent_factor_model.py research/machining-completeness/tasks/MC-038/test_pb00701_source_laurent_factor_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v18.py
      - name: Verify PB-007-01 v18 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v18.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v18.py --self-test
