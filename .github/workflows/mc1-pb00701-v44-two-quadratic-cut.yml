name: mc1-pb00701-v44-two-quadratic-cut
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_two_quadratic_cut_restriction.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v44_two_quadratic_cut_restriction.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v44-two-quadratic-cut-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_mixed_cut_child_interface.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_irrational_cut_source_sign.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_global_derivative.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_algebraic_child_map_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-v44-two-quadratic-cut.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_two_quadratic_cut_restriction.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v44_two_quadratic_cut_restriction.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v44-two-quadratic-cut-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_mixed_cut_child_interface.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_irrational_cut_source_sign.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_v44_global_derivative.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701_algebraic_child_map_model.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-v44-two-quadratic-cut.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show literal source head
        run: git rev-parse HEAD
      - name: Exact source restriction, synthetic field and adversarial controls
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v44_two_quadratic_cut_restriction.py --contract --self-test
