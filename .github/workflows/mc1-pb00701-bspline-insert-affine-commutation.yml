name: MC-038 exact B-spline insertion affine commutation research
on:
  push:
    branches:
      - research/mc038-bspline-insertion-affine-composition-20261108
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701_bspline_insert_affine_commutation_20261108.py
      - research/machining-completeness/tasks/MC-038/pb00701-bspline-insert-affine-commutation-20261108.md
      - .github/workflows/mc1-pb00701-bspline-insert-affine-commutation.yml
      - research/machining-completeness/tasks/MC-038/pb00701_bspline_affine_time_covariance_20261108.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commuting-proof-and-both-parent-theorems:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require literal committed source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact commuting proof and adversarial tests
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_bspline_insert_affine_commutation_20261108.py --contract --self-test
      - name: Insertion lineage parent and precision correction
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_bspline_knot_insertion_lineage_20261108.py --contract --self-test
      - name: Source-time covariance parent
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_bspline_affine_time_covariance_20261108.py --contract --self-test
      - name: Original genuine B-spline source and both harmonics
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_genuine_bspline_knot_bridge_20261108.py --contract --self-test
      - name: Inherited complete event / boundary / order proofs
        run: |
          python3 research/machining-completeness/tasks/MC-038/pb00701_generic_second_order_boundary_20261108.py --contract --self-test
          python3 research/machining-completeness/tasks/MC-038/pb00701_generic_zero_knot_extension_20261108.py --contract --self-test
          python3 research/machining-completeness/tasks/MC-038/pb00701_generic_interval_events_20261108.py --contract --self-test

  complete-original-v54-v2-evidence-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require literal committed source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently reproduce complete original V54 and V2 evidence
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract

  mc1-programme-static-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require literal committed source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check full MC-1 static programme authority
        run: python3 tools/validate_machining_completeness.py
