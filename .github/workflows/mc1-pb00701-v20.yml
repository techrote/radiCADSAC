name: mc1-pb00701-v20
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_pointwise_derivative_envelope_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_pointwise_derivative_envelope_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v20.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-pointwise-derivative-envelope-boundary-v20.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v20.md'
      - 'docs/machining-completeness/46-PB00701-POINTWISE-DERIVATIVE-ENVELOPE.md'
      - '.github/workflows/mc1-pb00701-v20.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_pointwise_derivative_envelope_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_pointwise_derivative_envelope_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v20.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-pointwise-derivative-envelope-boundary-v20.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v20.md'
      - 'docs/machining-completeness/46-PB00701-POINTWISE-DERIVATIVE-ENVELOPE.md'
      - '.github/workflows/mc1-pb00701-v20.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v20 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_pointwise_derivative_envelope_model.py research/machining-completeness/tasks/MC-038/test_pb00701_pointwise_derivative_envelope_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v20.py
      - name: Verify PB-007-01 v20 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v20.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v20.py --self-test
