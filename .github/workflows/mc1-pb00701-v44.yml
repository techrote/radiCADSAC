name: mc1-pb00701-v44
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_algebraic_orientation_cut_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_orientation_cut_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_orientation_cut_authority.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v44.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-algebraic-orientation-cut-v44.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v44.md'
      - 'docs/machining-completeness/68-PB00701-ALGEBRAIC-ORIENTATION-CUT.md'
      - '.github/workflows/mc1-pb00701-v44.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_algebraic_orientation_cut_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_orientation_cut_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_orientation_cut_authority.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v44.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-algebraic-orientation-cut-v44.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v44.md'
      - 'docs/machining-completeness/68-PB00701-ALGEBRAIC-ORIENTATION-CUT.md'
      - '.github/workflows/mc1-pb00701-v44.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v44 boundary
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_algebraic_orientation_cut_model.py research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_orientation_cut_adversarial.py research/machining-completeness/tasks/MC-038/test_pb00701_algebraic_orientation_cut_authority.py research/machining-completeness/tasks/MC-038/verify_pb00701_v44.py
      - name: Verify PB-007-01 v44 contract
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v44.py --contract
      - name: Verify exact algebraic root certificates
        run: python3 -c "import sys; sys.path.insert(0, 'research/machining-completeness/tasks/MC-038'); import test_pb00701_algebraic_orientation_cut_adversarial as t; t.run_algebraic_roots()"
      - name: Verify genuine v41 residual boundary
        run: python3 -c "import sys; sys.path.insert(0, 'research/machining-completeness/tasks/MC-038'); import test_pb00701_algebraic_orientation_cut_adversarial as t; t.run_genuine_residual()"
      - name: Verify v41 precedence
        run: python3 -c "import sys; sys.path.insert(0, 'research/machining-completeness/tasks/MC-038'); import test_pb00701_algebraic_orientation_cut_adversarial as t; t.run_precedence()"
      - name: Verify authority rejection controls
        run: python3 -c "import sys; sys.path.insert(0, 'research/machining-completeness/tasks/MC-038'); import test_pb00701_algebraic_orientation_cut_authority as t; t.run_authority_controls()"
      - name: Verify complete PB-007-01 v44 self-test
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v44.py --self-test
