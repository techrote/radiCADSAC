name: MC-038 frozen V9 Cayley monodromy falsification
on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v9_cayley_monodromy_boundary_20261105.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_v9_cayley_monodromy_boundary_20261105.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v9-cayley-monodromy-boundary-20261105.*'
      - '.github/workflows/mc1-pb00701-v9-cayley-monodromy-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_v9_cayley_monodromy_boundary_20261105.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_v9_cayley_monodromy_boundary_20261105.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-v9-cayley-monodromy-boundary-20261105.*'
      - '.github/workflows/mc1-pb00701-v9-cayley-monodromy-boundary.yml'
permissions:
  contents: read
jobs:
  original-source-cayley-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify literal checked-out source
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'literal-head=%s\n' "$actual"
      - name: Verify frozen original source and Cayley algebra receipt
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_v9_cayley_monodromy_boundary_20261105.py --contract --self-test
      - name: Adversarial original-source mutation tests
        run: python3 research/machining-completeness/tasks/MC-038/test_pb00701_v9_cayley_monodromy_boundary_20261105.py
      - name: Fresh complete 50-source original evidence replay
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract
      - name: MC-1 static source and programme invariants
        run: python3 tools/validate_machining_completeness.py
