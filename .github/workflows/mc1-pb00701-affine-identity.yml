name: mc1-pb00701-affine-identity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_affine_identity_frontier.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-affine-phase-identity-research.md'
      - '.github/workflows/mc1-pb00701-affine-identity.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned original-source affine-identity lemma and exact arithmetic controls
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_affine_identity_frontier.py --contract --self-test
