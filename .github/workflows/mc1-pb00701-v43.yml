name: mc1-pb00701-v43
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_correlated_closed_handoff_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_correlated_closed_handoff_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v43.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-correlated-closed-handoff-v43.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v43.md'
      - 'docs/machining-completeness/68-PB00701-CORRELATED-CLOSED-HANDOFF.md'
      - '.github/workflows/mc1-pb00701-v43.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_correlated_closed_handoff_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_correlated_closed_handoff_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v43.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-correlated-closed-handoff-v43.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v43.md'
      - 'docs/machining-completeness/68-PB00701-CORRELATED-CLOSED-HANDOFF.md'
      - '.github/workflows/mc1-pb00701-v43.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v43 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_correlated_closed_handoff_model.py research/machining-completeness/tasks/MC-038/test_pb00701_correlated_closed_handoff_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v43.py
      - name: Verify PB-007-01 v43 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v43.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v43.py --self-test
