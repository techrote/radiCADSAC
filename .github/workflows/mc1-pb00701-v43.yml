name: mc1-pb00701-v43
on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_correlated_closed_handoff_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_correlated_closed_handoff_adversarial.py'
      - '.github/workflows/mc1-pb00701-v43.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v43 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_correlated_closed_handoff_model.py research/machining-completeness/tasks/MC-038/test_pb00701_correlated_closed_handoff_adversarial.py
      - name: Verify PB-007-01 v43 correlated handoff
        run: python3 research/machining-completeness/tasks/MC-038/test_pb00701_correlated_closed_handoff_adversarial.py
