name: mc-adoption-inventory
on:
  push:
    branches: [mc-1-workflow-adoption]
    paths:
      - .github/workflows/mc-adoption-inventory.yml
      - tools/mc_inventory.py
permissions:
  contents: read
  issues: read
concurrency:
  group: mc-adoption-inventory
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory immutable planning baseline without native execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/mc_inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-adoption-baseline
          path: .mc-inventory/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
