name: mc1-pb00701-cayley-h1-span
on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_cayley_h1_span.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_cayley_h1_span.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-cayley-h1-span.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-cayley-h1-span-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-post-v54-evidence-reconciliation-v2.json'
      - '.github/workflows/mc1-pb00701-cayley-h1-span.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_cayley_h1_span.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_cayley_h1_span.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-cayley-h1-span.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-cayley-h1-span-research.md'
      - '.github/workflows/mc1-pb00701-cayley-h1-span.yml'
permissions:
  contents: read
jobs:
  cayley-h1-span:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact original-source V43 event/sign theorem and adversarial controls
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_cayley_h1_span.py --contract --self-test
      - name: Independent fifty-source historical evidence reconciliation
        run: |
          set -euo pipefail
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract
