name: mc1-pb00701-pinned-trig-child-views
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_pinned_trig_child_views.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_pinned_trig_child_views.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-pinned-trig-child-views-research.md'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v27_fixed_source_order.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v41_v13_fixed_source_order.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v43_refusal_cone.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-pinned-trig-child-views.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_pinned_trig_child_views.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_pinned_trig_child_views.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-pinned-trig-child-views-research.md'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v27_fixed_source_order.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v41_v13_fixed_source_order.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v43_refusal_cone.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-pinned-trig-child-views.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact original-source child-view composition and adversarial refusals
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_pinned_trig_child_views.py --contract --self-test
