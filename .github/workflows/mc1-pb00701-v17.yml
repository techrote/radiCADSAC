name: mc1-pb00701-v17
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_even_trig_multiplier_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_even_trig_multiplier_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v17.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-even-trig-multiplier-boundary-v17.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v17.md'
      - 'docs/machining-completeness/43-PB00701-EVEN-TRIG-PROJECTIVE-MULTIPLIER.md'
      - '.github/workflows/mc1-pb00701-v17.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_even_trig_multiplier_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_even_trig_multiplier_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v17.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-even-trig-multiplier-boundary-v17.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v17.md'
      - 'docs/machining-completeness/43-PB00701-EVEN-TRIG-PROJECTIVE-MULTIPLIER.md'
      - '.github/workflows/mc1-pb00701-v17.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v17 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_even_trig_multiplier_model.py research/machining-completeness/tasks/MC-038/test_pb00701_even_trig_multiplier_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v17.py
      - name: Verify PB-007-01 v17 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v17.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v17.py --self-test
