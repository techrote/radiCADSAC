name: MC-044 final-output denominator preparation

on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-044/**'
      - '.github/workflows/mc044-final-denominator-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-plan:
    name: MC-044 PLAN_ONLY ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact checkout
        run: git rev-parse HEAD
      - name: Execute source-pinned refusal mutations
        run: python research/machining-completeness/tasks/MC-044/qualification_readiness.py --self-test
      - name: Generate and re-import PLAN_ONLY packet
        shell: bash
        run: |
          python research/machining-completeness/tasks/MC-044/qualification_readiness.py --emit-plan > mc044-plan.json
          python research/machining-completeness/tasks/MC-044/qualification_readiness.py --check-plan mc044-plan.json
      - name: Preserve MC-1 static contract validation
        run: python tools/validate_machining_completeness.py --self-test
