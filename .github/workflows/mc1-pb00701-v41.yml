name: mc1-pb00701-v41
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_orientation_root_partition_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_orientation_root_partition_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v41.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-orientation-root-partition-v41.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v41.md'
      - 'docs/machining-completeness/67-PB00701-ORIENTATION-ROOT-PARTITION.md'
      - '.github/workflows/mc1-pb00701-v41.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_orientation_root_partition_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_orientation_root_partition_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v41.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-orientation-root-partition-v41.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v41.md'
      - 'docs/machining-completeness/67-PB00701-ORIENTATION-ROOT-PARTITION.md'
      - '.github/workflows/mc1-pb00701-v41.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v41 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_orientation_root_partition_model.py research/machining-completeness/tasks/MC-038/test_pb00701_orientation_root_partition_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v41.py
      - name: Verify PB-007-01 v41 contract
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v41.py --contract
      - name: Verify PB-007-01 v41 adversarial controls
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v41.py --self-test
