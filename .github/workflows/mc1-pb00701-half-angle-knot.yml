name: mc1-pb00701-half-angle-knot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_half_angle_knot.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_half_angle_knot.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-half-angle-trig-knot-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-half-angle-knot.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_half_angle_knot.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_half_angle_knot.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-half-angle-trig-knot-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-half-angle-knot.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact half-angle ordered roots, multiplicity, tangencies and source-knot refusals
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_half_angle_knot.py --contract --self-test
