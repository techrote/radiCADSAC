name: MC-038 H1 rational phase-frame obstruction

on:
  push:
    branches:
      - research/mc038-h1-rational-phase-pole-obstruction-20261106
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701_rational_phase_frame_obstruction_20261106.py
      - research/machining-completeness/tasks/MC-038/pb00701-rational-phase-frame-obstruction-20261106.json
      - research/machining-completeness/tasks/MC-038/pb00701-rational-phase-frame-obstruction-20261106.md
      - .github/workflows/mc1-pb00701-rational-phase-frame-obstruction.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-original-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal head custody
        shell: bash
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact original source, receipt and independent adversaries
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_rational_phase_frame_obstruction_20261106.py --contract --self-test

  frozen-original-producer-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal head custody
        shell: bash
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full frozen V54/V2 producing reconciliation
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract

  static-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal head custody
        shell: bash
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: MC-1 authority/static verification
        run: python3 tools/validate_machining_completeness.py
