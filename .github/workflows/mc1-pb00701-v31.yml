name: mc1-pb00701-v31
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_pointwise_separator_blocker_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v31.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-pointwise-separator-blocker-v31.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v31.md'
      - 'docs/machining-completeness/57-PB00701-POINTWISE-SEPARATOR-BLOCKER.md'
      - '.github/workflows/mc1-pb00701-v31.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_pointwise_separator_blocker_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v31.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-pointwise-separator-blocker-v31.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v31.md'
      - 'docs/machining-completeness/57-PB00701-POINTWISE-SEPARATOR-BLOCKER.md'
      - '.github/workflows/mc1-pb00701-v31.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v31 blocker investigation
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/test_pb00701_pointwise_separator_blocker_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v31.py
      - name: Verify PB-007-01 v31 blocker contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v31.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v31.py --self-test
