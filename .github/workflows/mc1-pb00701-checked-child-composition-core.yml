name: mc1-pb00701-checked-child-composition-core
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_checked_child_composition_core.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_checked_child_composition_core.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-checked-child-composition-core-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-checked-child-composition-core.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_checked_child_composition_core.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_checked_child_composition_core.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-checked-child-composition-core-research.md'
      - 'research/machining-completeness/tasks/MC-038/pb00701-finite-owner-corpus-v54.json'
      - 'research/machining-completeness/tasks/MC-002/domain-contract-v1.json'
      - 'handoffs/current-authority.json'
      - '.github/workflows/mc1-pb00701-checked-child-composition-core.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact conditional composition and fail-closed adversarial controls
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_checked_child_composition_core.py --contract --self-test
