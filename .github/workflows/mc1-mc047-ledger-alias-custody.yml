name: mc1-mc047-ledger-alias-custody

on:
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-045/campaign_harness.py'
      - 'research/machining-completeness/tasks/MC-047/verify.py'
      - 'research/machining-completeness/tasks/MC-047/ledger_alias_custody_qualification.py'
      - 'research/machining-completeness/tasks/MC-047/ledger-alias-custody-20261105.md'
      - '.github/workflows/mc1-mc047-ledger-alias-custody.yml'
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-045/campaign_harness.py'
      - 'research/machining-completeness/tasks/MC-047/verify.py'
      - 'research/machining-completeness/tasks/MC-047/ledger_alias_custody_qualification.py'
      - '.github/workflows/mc1-mc047-ledger-alias-custody.yml'

permissions:
  contents: read

jobs:
  alias-custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate exact checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "Checkout: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile actual audited source and qualification harness
        shell: bash
        run: |
          python -m py_compile research/machining-completeness/tasks/MC-045/campaign_harness.py research/machining-completeness/tasks/MC-047/verify.py research/machining-completeness/tasks/MC-047/ledger_alias_custody_qualification.py
      - name: Real-source alias and mutation fault controls
        shell: bash
        run: |
          python research/machining-completeness/tasks/MC-047/ledger_alias_custody_qualification.py --contract
      - name: Original accepted MC-045 and MC-047 deterministic regressions
        shell: bash
        run: |
          python research/machining-completeness/tasks/MC-045/campaign_harness.py self-test
          python research/machining-completeness/tasks/MC-047/verify.py --contract
