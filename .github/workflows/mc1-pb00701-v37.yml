name: mc1-pb00701-v37
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_phase_correlated_two_polynomial_shared_factor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_phase_correlated_two_polynomial_shared_factor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v37.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-phase-correlated-two-polynomial-shared-factor-v37.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v37.md'
      - 'docs/machining-completeness/63-PB00701-PHASE-CORRELATED-TWO-POLYNOMIAL-SHARED-FACTOR.md'
      - '.github/workflows/mc1-pb00701-v37.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_phase_correlated_two_polynomial_shared_factor_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_phase_correlated_two_polynomial_shared_factor_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v37.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-phase-correlated-two-polynomial-shared-factor-v37.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v37.md'
      - 'docs/machining-completeness/63-PB00701-PHASE-CORRELATED-TWO-POLYNOMIAL-SHARED-FACTOR.md'
      - '.github/workflows/mc1-pb00701-v37.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v37 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_phase_correlated_two_polynomial_shared_factor_model.py research/machining-completeness/tasks/MC-038/test_pb00701_phase_correlated_two_polynomial_shared_factor_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v37.py
      - name: Verify PB-007-01 v37 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v37.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v37.py --self-test
