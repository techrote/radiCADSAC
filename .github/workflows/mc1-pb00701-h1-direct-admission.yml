name: MC-038 frozen V54 direct-H1 admission boundary

on:
  push:
    branches:
      - research/mc038-h1-direct-admission-20261106
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_h1_direct_admission_20261106.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-h1-direct-admission-20261106.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-h1-direct-admission-20261106.md'
      - '.github/workflows/mc1-pb00701-h1-direct-admission.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_h1_direct_admission_20261106.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-h1-direct-admission-20261106.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-h1-direct-admission-20261106.md'
      - '.github/workflows/mc1-pb00701-h1-direct-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-source-grammar-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal checked out head provenance
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "ACTUAL_HEAD=$(git rev-parse HEAD)"
      - name: Bound original corpus and independently challenge direct H1 admission
        run: python3 research/machining-completeness/tasks/MC-038/pb00701_h1_direct_admission_20261106.py --contract --self-test
  full-original-v54-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal source head identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Reexecute original-source V54/V2 producer and adversarial controls
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract --self-test
  static-mc1-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Literal source head identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Preserve all MC-1 authority and static contracts
        run: python3 tools/validate_machining_completeness.py
