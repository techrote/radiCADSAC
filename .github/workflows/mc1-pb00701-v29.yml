name: mc1-pb00701-v29
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_pythagorean_phase_cell_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_pythagorean_phase_cell_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v29.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-pythagorean-phase-cell-boundary-v29.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v29.md'
      - 'docs/machining-completeness/55-PB00701-PYTHAGOREAN-PHASE-CELL.md'
      - '.github/workflows/mc1-pb00701-v29.yml'
  pull_request:
    paths:
      - 'research/machining-completeness/tasks/MC-038/pb00701_pythagorean_phase_cell_model.py'
      - 'research/machining-completeness/tasks/MC-038/test_pb00701_pythagorean_phase_cell_adversarial.py'
      - 'research/machining-completeness/tasks/MC-038/verify_pb00701_v29.py'
      - 'research/machining-completeness/tasks/MC-038/pb00701-pythagorean-phase-cell-boundary-v29.json'
      - 'research/machining-completeness/tasks/MC-038/pb00701-report-v29.md'
      - 'docs/machining-completeness/55-PB00701-PYTHAGOREAN-PHASE-CELL.md'
      - '.github/workflows/mc1-pb00701-v29.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PB-007-01 v29 exact route
        run: python3 -m py_compile research/machining-completeness/tasks/MC-038/pb00701_pythagorean_phase_cell_model.py research/machining-completeness/tasks/MC-038/test_pb00701_pythagorean_phase_cell_adversarial.py research/machining-completeness/tasks/MC-038/verify_pb00701_v29.py
      - name: Verify PB-007-01 v29 contract and adversarial controls
        run: |
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v29.py --contract
          python3 research/machining-completeness/tasks/MC-038/verify_pb00701_v29.py --self-test
