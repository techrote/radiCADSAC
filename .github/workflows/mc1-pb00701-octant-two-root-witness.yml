name: MC-038 exact two-root octant rational-witness research
on:
  push:
    branches:
      - research/mc038-octant-two-root-witness-20261109
  pull_request:
    paths:
      - research/machining-completeness/tasks/MC-038/pb00701_octant_two_root_witness_20261109.py
      - research/machining-completeness/tasks/MC-038/pb00701-octant-two-root-witness-20261109.md
      - research/machining-completeness/tasks/MC-038/pb00701-octant-two-root-witness-20261109.json
      - .github/workflows/mc1-pb00701-octant-two-root-witness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rational-two-root-certificate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check literal candidate head
        shell: bash
        run: |
          echo "LITERAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fifteen focused and adversarial tests
        run: python research/machining-completeness/tasks/MC-038/pb00701_octant_two_root_witness_20261109.py --self-test
      - name: Exact rational prospective contract
        run: python research/machining-completeness/tasks/MC-038/pb00701_octant_two_root_witness_20261109.py --contract

  frozen-original-source-producing-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact literal head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Complete fifty-source historical V54/V2 producing replay
        run: python3 research/machining-completeness/tasks/MC-038/verify_pb00701_post_v54_evidence_reconciliation_v2.py --contract

  mc1-authority-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact literal head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Current MC-1 static validator
        run: python3 tools/validate_machining_completeness.py
