name: mc1-pb00701-v41-diagnostic
on:
  push:
    branches: [pb00701-v41-orientation-root-partition]
    paths:
      - 'research/machining-completeness/tasks/MC-038/diagnose_pb00701_v41.py'
      - '.github/workflows/mc1-pb00701-v41-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Characterize exact v41 residual child blockers
        run: python3 research/machining-completeness/tasks/MC-038/diagnose_pb00701_v41.py
      - uses: actions/upload-artifact@v4
        with:
          name: v41-diagnostics
          path: v41-diagnostics.json
